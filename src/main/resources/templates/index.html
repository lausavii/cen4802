<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow task-card">

                <div class="task-header p-4">
                    <h1 class="text-center mb-0">My to-do List</h1>
                </div>

                <div class="card-body p-4">

                    <h5 class="mb-3">My Tasks</h5>

                    <div class="list-group mb-4">

                        <div class="list-group-item task-item d-flex justify-content-between align-items-center"
                             th:each="task : ${tasks}">

                            <span th:if="${task.completed}"
                                  class="completed-task">
                                ✓
                                <span th:text="${task.description}"></span>
                            </span>

                            <span th:unless="${task.completed}"
                                  th:text="${task.description}">
                            </span>

                            <form th:if="${!task.completed}"
                                  th:action="@{/complete/{id}(id=${task.id})}"
                                  method="post">

                                <button type="submit"
                                        class="btn btn-success btn-sm">
                                    Complete
                                </button>

                            </form>

                        </div>

                    </div>

                    <div class="add-section p-3">

                        <h5 class="mb-3">Add a Task</h5>

                        <form action="/add" method="post">

                            <div class="input-group">

                                <input type="text"
                                       name="description"
                                       class="form-control"
                                       placeholder="Enter a task"
                                       required>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Add Task
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
